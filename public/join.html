<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the Free Trial · HistoryMemo</title>
  <meta name="description" content="Sign up for the HistoryMemo free trial: your parents' life story, in their own voice.">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { font-size: 18px; }
    main { max-width: 560px; padding: 20px 0 60px; display: flex; flex-direction: column; gap: 16px; }
    .langs { display: flex; gap: 8px; flex-wrap: wrap; }
    .langs button { width: auto; min-height: 44px; padding: 8px 16px; font-size: 16px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--ink); font-weight: 600; box-shadow: none; }
    .langs button.on { background: var(--ink); color: #fbf6ee; border-color: var(--ink); }
    h1 { color: var(--red); font-family: "Iowan Old Style", Georgia, "Hiragino Mincho ProN", serif; }
    form { display: flex; flex-direction: column; gap: 14px; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 17px; }
    label small { font-weight: 400; color: var(--muted); }
    input[type=text], input[type=email], input[type=tel], select, textarea {
      font: inherit; font-size: 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); width: 100%; }
    textarea { min-height: 80px; }
    main, form, label, fieldset { min-width: 0; max-width: 100%; }
    fieldset { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 12px; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; background: #fff; }
    fieldset legend { font-weight: 600; font-size: 17px; padding: 0 4px; }
    fieldset label, .check { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; }
    fieldset input, .check input { width: 22px; height: 22px; flex: none; }
    .check { align-items: flex-start; font-size: 16px; }
    .hp { position: absolute; left: -9999px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
    .err { color: var(--red); font-weight: 600; margin: 0; }
    .small { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
<main id="app"></main>
<script type="module">
const T = {
  en: { title: 'Join the free trial', lead: "Your parents' life story, in their own voice. Tell us a little, and we'll email you within 2 business days.",
        name: 'Your name', email: 'Your email', phone: 'Phone or LINE', opt: '(optional)', who: 'Who would tell the stories?',
        whoOpts: ['Mother', 'Father', 'Grandmother', 'Grandfather', 'Someone else'], langs: 'Their language', country: 'Where do you live?',
        buy: 'After the free trial, would you buy the digital book (US$65 / ¥9,800)?', buyOpts: [['yes', 'Yes, probably'], ['maybe', 'Maybe'], ['trial', 'Just the free trial for now']],
        note: 'Anything else?', consent: 'I agree to be contacted about the HistoryMemo trial, and I have read the <a href="/privacy.html" target="_blank">privacy policy</a>.',
        send: 'Join the free trial', sending: 'Sending…', thanks: 'Thank you! 🎉', thanksText: "We'll email you within 2 business days to set up the free trial.",
        sample: 'See a sample book', needEmail: 'Please enter your email.', needConsent: 'Please tick the box to agree.', failed: 'Could not send. Please email us instead:' },
  ja: { title: 'DENKI（伝記）無料体験に申し込む', lead: '親の人生を、本人の声で一冊の本に。簡単にご記入いただければ、2営業日以内にメールでご連絡します。',
        name: 'お名前', email: 'メールアドレス', phone: '電話番号・LINE', opt: '（任意）', who: 'お話をするのはどなたですか？',
        whoOpts: ['母', '父', '祖母', '祖父', 'その他'], langs: '話す言葉', country: 'お住まいの国・地域',
        buy: '無料体験の後、デジタル版（¥9,800 税込）を購入したいと思いますか？', buyOpts: [['yes', 'はい、たぶん'], ['maybe', 'わからない'], ['trial', 'まずは無料体験だけ']],
        note: 'その他・ご質問', consent: 'DENKI（伝記・HistoryMemo）の体験についての連絡を受け取ることに同意し、<a href="/privacy.html#ja" target="_blank">プライバシーポリシー</a>を読みました。',
        send: '無料体験に申し込む', sending: '送信中…', thanks: 'ありがとうございます 🎉', thanksText: '2営業日以内に、無料体験のご案内をメールでお送りします。',
        sample: '見本の本を見る', needEmail: 'メールアドレスを入力してください。', needConsent: '同意のチェックをお願いします。', failed: '送信できませんでした。こちらにメールでご連絡ください：' },
  vi: { title: 'Đăng ký dùng thử miễn phí', lead: 'Cuốn sách đời ông bà, bằng chính giọng kể. Điền vài dòng, chúng tôi sẽ email cho bạn trong 2 ngày làm việc.',
        name: 'Tên của bạn', email: 'Email của bạn', phone: 'Số điện thoại hoặc Zalo/LINE', opt: '(không bắt buộc)', who: 'Ai sẽ kể chuyện?',
        whoOpts: ['Mẹ', 'Ba', 'Bà', 'Ông', 'Người khác'], langs: 'Ngôn ngữ của người kể', country: 'Bạn sống ở đâu?',
        buy: 'Sau khi dùng thử, bạn có muốn mua sách điện tử (1.600.000đ / US$65) không?', buyOpts: [['yes', 'Có, chắc là có'], ['maybe', 'Có thể'], ['trial', 'Trước mắt chỉ dùng thử']],
        note: 'Bạn muốn nhắn thêm gì không?', consent: 'Tôi đồng ý được liên hệ về việc dùng thử HistoryMemo và đã đọc <a href="/privacy.html#vi" target="_blank">chính sách quyền riêng tư</a>.',
        send: 'Đăng ký dùng thử', sending: 'Đang gửi…', thanks: 'Cảm ơn bạn! 🎉', thanksText: 'Chúng tôi sẽ email cho bạn trong 2 ngày làm việc để bắt đầu dùng thử.',
        sample: 'Xem sách mẫu', needEmail: 'Vui lòng nhập email.', needConsent: 'Vui lòng đánh dấu để đồng ý.', failed: 'Chưa gửi được. Vui lòng email cho chúng tôi:' },
};
const LANGS = [['en', 'English'], ['ja', '日本語'], ['vi', 'Tiếng Việt'], ['teo', 'Teochew / Tiều'], ['other', 'Other']];
const EMAIL = 'dvu@linadaichiagency.com';
const params = new URLSearchParams(location.search);
const src = (params.get('s') || '').slice(0, 40);
const nav = (navigator.language || 'en').slice(0, 2);
let lang = ['en', 'ja', 'vi'].includes(params.get('lang')) ? params.get('lang') : (['ja', 'vi'].includes(nav) ? nav : 'en');
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render(keep = {}) {
  const t = T[lang];
  document.documentElement.lang = lang;
  app.innerHTML = `
    <div class="langs">${[['en', 'English'], ['ja', '日本語'], ['vi', 'Tiếng Việt']].map(([l, n]) => `<button type="button" data-l="${l}" class="${l === lang ? 'on' : ''}">${n}</button>`).join('')}</div>
    <h1>${t.title}</h1>
    <p class="lead">${t.lead}</p>
    <form id="f" novalidate>
      <label>${t.name}<input type="text" name="name" autocomplete="name" maxlength="80"></label>
      <label>${t.email}<input type="email" name="email" autocomplete="email" maxlength="120" required></label>
      <label>${t.phone} <small>${t.opt}</small><input type="tel" name="phone" autocomplete="tel" maxlength="40"></label>
      <label>${t.who}<select name="who"><option value=""></option>${t.whoOpts.map(o => `<option>${esc(o)}</option>`).join('')}</select></label>
      <fieldset><legend>${t.langs}</legend>${LANGS.map(([v, n]) => `<label><input type="checkbox" name="langs" value="${v}">${n}</label>`).join('')}</fieldset>
      <label>${t.country}<input type="text" name="country" autocomplete="country-name" maxlength="60"></label>
      <fieldset><legend>${t.buy}</legend>${t.buyOpts.map(([v, n]) => `<label><input type="radio" name="buy" value="${v}">${esc(n)}</label>`).join('')}</fieldset>
      <label>${t.note} <small>${t.opt}</small><textarea name="note" maxlength="500"></textarea></label>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="check"><input type="checkbox" name="consent"><span>${t.consent}</span></label>
      <p class="err" id="err" hidden></p>
      <button class="primary" type="submit">${t.send}</button>
    </form>
    <p class="small"><a href="/book.html?sample=${lang}">${t.sample}</a> · <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a> · Lina &amp; Daichi LLC</p>`;
  const f = document.getElementById('f');
  for (const [k, v] of Object.entries(keep)) {
    const el = f.elements[k];
    if (!el) continue;
    if (el instanceof RadioNodeList) [...el].forEach(x => { x.checked = Array.isArray(v) ? v.includes(x.value) : x.value === v; });
    else if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  }
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { lang = b.dataset.l; render(read(f)); });
  f.onsubmit = e => { e.preventDefault(); send(f); };
}

function read(f) {
  const d = Object.fromEntries(['name', 'email', 'phone', 'who', 'country', 'note', 'website'].map(k => [k, f.elements[k].value.trim()]));
  d.langs = [...f.querySelectorAll('[name=langs]:checked')].map(x => x.value);
  d.buy = f.querySelector('[name=buy]:checked')?.value || '';
  d.consent = f.elements.consent.checked;
  return d;
}

async function send(f) {
  const t = T[lang], d = read(f), err = document.getElementById('err'), btn = f.querySelector('button[type=submit]');
  const show = html => { err.innerHTML = html; err.hidden = false; };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return show(t.needEmail);
  if (!d.consent) return show(t.needConsent);
  err.hidden = true; btn.disabled = true; btn.textContent = t.sending;
  try {
    const r = await fetch('/api/join', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...d, langs: d.langs.join(', '), lang, src }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    app.innerHTML = `<h1>${t.thanks}</h1><p class="lead">${t.thanksText}</p>
      <p><a class="primary" style="display:block;text-align:center;padding:18px;border-radius:22px;color:#fff;text-decoration:none" href="/book.html?sample=${lang}">📖 ${t.sample}</a></p>`;
  } catch {
    const body = encodeURIComponent(Object.entries({ ...d, src }).filter(([k, v]) => v && k !== 'website').map(([k, v]) => `${k}: ${v}`).join('\n'));
    show(`${t.failed} <a href="mailto:${EMAIL}?subject=HistoryMemo%20free%20trial&body=${body}">${EMAIL}</a>`);
    btn.disabled = false; btn.textContent = t.send;
  }
}
render();
</script>
</body>
</html>
