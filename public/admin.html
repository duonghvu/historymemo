<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HistoryMemo Admin</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { font-size: 16px; }
    main { max-width: 880px; padding: 24px 0 60px; display: flex; flex-direction: column; gap: 20px; }
    h1 { font-size: 28px; } h2 { margin: 0; font-size: 21px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input, select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; min-width: 0; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); flex: 1 1 180px; }
    label.inline { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-size: 16px; flex: none; }
    .sm { width: auto; min-height: 40px; padding: 8px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; box-shadow: none !important; }
    .primary.sm { font-size: 15px; }
    .card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
    .card .name { font-weight: 700; font-size: 18px; }
    .pill { font-size: 13px; padding: 2px 9px; border-radius: 99px; background: #eee3d0; white-space: nowrap; }
    .pill.ok { background: #d9f0dc; color: #1c5e2a; }
    code { word-break: break-all; font-size: 13px; background: #f3e7d3; padding: 6px 8px; border-radius: 8px; }
    .q { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    .q .t { font-weight: 600; } .q .m { color: var(--muted); font-size: 13px; }
    .theme { margin-top: 14px; font-weight: 700; color: var(--gold); text-transform: uppercase; font-size: 13px; letter-spacing: .05em; }
    .rec { background: var(--red) !important; color: #fff !important; }
    .qr svg { width: 150px; height: 150px; }
    form.edit { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
    .muted { color: var(--muted); font-size: 14px; }
    .progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
    .progress div { height: 100%; background: var(--red); }
  </style>
</head>
<body>
<main id="admin"></main>
<datalist id="tzs">
  <option value="Asia/Ho_Chi_Minh"><option value="Asia/Tokyo"><option value="Asia/Singapore"><option value="Asia/Shanghai">
  <option value="Australia/Sydney"><option value="Europe/London"><option value="Europe/Paris"><option value="Europe/Berlin">
  <option value="America/New_York"><option value="America/Chicago"><option value="America/Denver"><option value="America/Los_Angeles">
  <option value="Pacific/Honolulu"><option value="UTC">
</datalist>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="/admin.js"></script>
</body>
</html>
