<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Story Book · HistoryMemo</title>
  <meta name="description" content="Print-ready HistoryMemo book: A5 pages, chapters in life order, a QR code for every story.">
  <link rel="icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@400;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap">
  <style>
    :root { --ink: #2a211b; --muted: #7a6a5d; --red: #b3261e; --line: #e2d5c1; --paper: #fffdf9; --bg: #efe6d8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font-family: 'Noto Serif', 'Noto Serif JP', Georgia, serif; font-size: 10.5pt; line-height: 1.6; }
    :lang(ja) body, body:lang(ja) { font-family: 'Noto Serif JP', 'Noto Serif', serif; line-height: 1.8; }
    .sans { font-family: 'Noto Sans', 'Noto Sans JP', -apple-system, sans-serif; }

    /* ── screen: toolbar + pages as sheets ── */
    .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
           padding: 10px 16px; background: #2a211b; color: #fbf6ee; font: 600 15px/1.3 'Noto Sans', 'Noto Sans JP', sans-serif; }
    .bar a, .bar button { font: inherit; color: #fbf6ee; background: transparent; border: 1px solid #6b5a4d; border-radius: 99px; padding: 8px 14px; text-decoration: none; cursor: pointer; }
    .bar a.on { background: #fbf6ee; color: #2a211b; }
    .bar .primary { background: var(--red); border-color: var(--red); }
    .msg { max-width: 560px; margin: 40px auto; padding: 0 16px; font: 17px/1.5 'Noto Sans', sans-serif; }
    .page { width: 148mm; min-height: 210mm; margin: 18px auto; padding: 16mm 14mm 18mm; background: var(--paper);
            box-shadow: 0 2px 10px rgba(42, 33, 27, .18); position: relative; }
    @media (max-width: 600px) { .page { width: auto; min-height: 0; margin: 12px 16px; padding: 24px 18px; } }

    /* ── print: A5 book ── */
    @page { size: A5; margin: 16mm 14mm 18mm; @bottom-center { content: counter(page); font: 8.5pt 'Noto Sans', sans-serif; color: #7a6a5d; } }
    @page :first { @bottom-center { content: none; } }
    @media print {
      html, body { background: #fff; }
      .bar, .screen-only { display: none !important; }
      .page { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; background: none; break-after: page; }
      .page:last-child { break-after: auto; }
    }

    /* cover */
    .cover { display: flex; flex-direction: column; justify-content: center; text-align: center; min-height: 210mm; }
    @media print { .cover { min-height: 170mm; } }
    .cover .rule { width: 46mm; height: 2px; background: var(--red); margin: 7mm auto; }
    .cover h1 { font-size: 27pt; line-height: 1.2; margin: 0; font-weight: 700; color: var(--red); text-wrap: balance; }
    .cover p { margin: 0; color: var(--muted); }
    .ribbon { display: inline-block; margin: 0 auto 10mm; padding: 4px 12px; border: 1.5px solid var(--red); border-radius: 99px; color: var(--red);
              font: 600 8.5pt/1.3 'Noto Sans', 'Noto Sans JP', sans-serif; letter-spacing: .06em; }
    .brand { margin-top: 18mm !important; font: 600 9pt 'Noto Sans', sans-serif; letter-spacing: .14em; color: var(--red) !important; }

    /* contents */
    h2.toc { font-size: 15pt; margin: 0 0 6mm; }
    ol.toc { list-style: none; padding: 0; margin: 0; }
    ol.toc li { display: flex; gap: 4mm; padding: 2.4mm 0; border-bottom: 1px dotted var(--line); }
    ol.toc .n { color: var(--red); font-weight: 700; min-width: 7mm; }
    ol.toc .c { margin-left: auto; color: var(--muted); font-size: 9pt; }
    .how { margin-top: 8mm; font-size: 9pt; color: var(--muted); display: flex; gap: 4mm; align-items: center; }
    .how svg { width: 15mm; height: 15mm; flex: none; }

    /* chapters + stories */
    .chapter-no { font: 600 8.5pt 'Noto Sans', 'Noto Sans JP', sans-serif; letter-spacing: .12em; color: var(--red); text-transform: uppercase; margin: 0; }
    h2.chapter { font-size: 18pt; line-height: 1.25; margin: 1mm 0 5mm; }
    .intro { font-style: italic; margin: 0 0 1.5mm; }
    .intro-note { font: 7.5pt 'Noto Sans', 'Noto Sans JP', sans-serif; color: var(--muted); margin: 0 0 6mm; }
    article { break-inside: avoid; display: grid; grid-template-columns: 1fr 22mm; gap: 1mm 5mm; padding: 5mm 0; border-top: 1px solid var(--line); }
    article.sub { margin-left: 6mm; padding-top: 3.5mm; border-top-style: dashed; }
    article h3 { grid-column: 1; font-size: 11.5pt; line-height: 1.4; margin: 0; break-after: avoid; }
    article.sub h3 { font-size: 10.5pt; }
    article .orig { grid-column: 1; margin: 0; font-style: italic; color: var(--muted); font-size: 9.5pt; }
    article .meta { grid-column: 1; margin: 0; font: 8pt 'Noto Sans', 'Noto Sans JP', sans-serif; color: var(--muted); }
    article .qr { grid-column: 2; grid-row: 1 / span 3; text-align: center; font: 6.5pt/1.3 'Noto Sans', 'Noto Sans JP', sans-serif; color: var(--muted); break-inside: avoid; }
    article .qr svg { width: 22mm; height: 22mm; display: block; }
    article blockquote { grid-column: 1 / -1; margin: 2.5mm 0 0; padding-left: 4mm; border-left: 2px solid var(--red); }
    article blockquote p { margin: 0; }
    .end { text-align: center; }
    .end .note { font-size: 8.5pt; color: var(--muted); font-style: italic; max-width: 105mm; margin: 6mm auto 0; }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden></div>
  <main id="book"><p class="msg sans">Loading…</p></main>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module" src="/book.js"></script>
</body>
</html>
